services:
  db:
    image: postgres:17-alpine
    container_name: modelrail-db
    environment:
      POSTGRES_USER: modelrail
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: modelrail
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - modelrail_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelrail -d modelrail"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  modelrail_pgdata: