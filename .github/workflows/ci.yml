name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: modelrail
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: modelrail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modelrail -d modelrail_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.3
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build TypeScript SDK
        working-directory: frontend
        run: npx tsc -p ../sdk/typescript/tsconfig.json

      - name: Run Go unit and PostgreSQL integration checks
        env:
          MODELRAIL_TEST_DATABASE_URL: postgres://modelrail:ci_test_password@localhost:5432/modelrail_test?sslmode=disable
        run: go test -race ./...

      - name: Build Go service
        run: go build -trimpath -o modelrail .

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start ModelRail
        env:
          DATABASE_URL: postgres://modelrail:ci_test_password@localhost:5432/modelrail_test?sslmode=disable
          MODELRAIL_BOOTSTRAP_API_KEY: ci-bootstrap-key-0123456789abcdef0123456789abcdef
          MODELRAIL_ADDR: 127.0.0.1:8080
          RATE_LIMIT_PER_MINUTE: "1000"
        run: |
          nohup ./modelrail > /tmp/modelrail.log 2>&1 &
          echo $! > /tmp/modelrail.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/readyz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/modelrail.log
          exit 1

      - name: Run browser flow
        working-directory: frontend
        env:
          MODELRAIL_E2E_API_KEY: ci-bootstrap-key-0123456789abcdef0123456789abcdef
          MODELRAIL_E2E_URL: http://127.0.0.1:8080
        run: npm run test:e2e

      - name: Build production container
        run: docker build -t modelrail:ci .
